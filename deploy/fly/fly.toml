app = "speccheck-kyle-2026"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
image = "ghcr.io/wongywrongy/speccheck@sha256:25192e801f92f1f84ac1aa0841b897674e6c1fa036a20054fe13b51db778ccb2"

[env]
SPECCHECK_MODE = "live"
JUDGING_USD = "75"
JUDGING_CREDITS = "6000"
APP_STATE_DIR = "/state"
CAMPAIGN_BUDGET_FILE = "/state/campaign.sqlite3"
BUDGET_USD_PER_DAY = "8"
BUDGET_TAVILY_CREDITS_PER_DAY = "600"
BUDGET_USD_PER_RUN = "3"
BUDGET_TAVILY_CREDITS_PER_ITEM = "60"
MAX_CONCURRENCY = "2"
MAX_OUTPUT_TOKENS = "65536"
FIX_MAX_CANDIDATES = "1"
FIX_CREDIT_CAP = "12"
INVESTIGATE_MAX_STEPS = "6"
INVESTIGATE_CREDIT_CAP = "8"
UPLOADS_PER_IP_PER_HOUR = "30"
SPECCHECK_COMMIT = "7dce26afe0862b8d8aa39c756ba5c5ba6cb0a390"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "30s"
method = "GET"
path = "/api/health"

[[mounts]]
source = "speccheck_state"
destination = "/state"

[[vm]]
cpu_kind = "shared"
cpus = 2
memory = "2gb"

name: daily-recheck
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-recheck
  cancel-in-progress: false
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/wongywrongy/speccheck@sha256:e5c92a98a7d384e3e89c21819546fc9928ce6c6971f951cf1a4bc1c888dcbab2
    defaults:
      run:
        working-directory: /app
    env:
      SPECCHECK_URL: https://speccheck-wongywrongys-projects.vercel.app
      SPECCHECK_MODE: live
      RECHECK_RUNNER: GitHub Actions
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      ADMIN_TOKEN: ${{ secrets.SPECCHECK_ADMIN_TOKEN }}
      BUDGET_USD_PER_RUN: '0.50'
      BUDGET_USD_PER_DAY: '0.50'
      BUDGET_TAVILY_CREDITS_PER_ITEM: '40'
      BUDGET_TAVILY_CREDITS_PER_DAY: '40'
      MAX_OUTPUT_TOKENS: '65536'
      FIX_MAX_CANDIDATES: '1'
      MAX_CONCURRENCY: '2'
    steps:
      - name: Check whether today's report already exists
        id: due
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          import httpx
          now = datetime.now(timezone.utc)
          response = httpx.get(os.environ['SPECCHECK_URL'] + '/api/watch', timeout=30)
          if response.status_code != 404:
              response.raise_for_status()
          report = response.json() if response.status_code == 200 else {}
          fresh = report.get('mode') == 'live' and report.get('runner') == 'GitHub Actions' and report.get('checked_at', '')[:10] == now.date().isoformat()
          due = now < datetime(2026, 12, 15, 20, tzinfo=timezone.utc) and not fresh
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'needed={str(due).lower()}\n')
          PY
      - name: Re-check and publish the real report
        if: steps.due.outputs.needed == 'true'
        run: |
          test -n "$NEBIUS_API_KEY" && test -n "$TAVILY_API_KEY" && test -n "$ADMIN_TOKEN"
          python scripts/campaign_budget.py init-judging --usd 0.50 --credits 40
          python scripts/recheck.py --post "$SPECCHECK_URL"
      - name: Retain the report and settled ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-recheck-${{ github.run_id }}
          path: |
            /app/runs/watch/
            /app/.cache/budget/
          if-no-files-found: ignore
          retention-days: 30

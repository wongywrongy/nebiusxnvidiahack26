# GitHub supplies the clock; every launch goes through the authenticated app controller.
name: nightly-recheck
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly-recheck
  cancel-in-progress: false
jobs:
  recheck:
    # Keep disabled until the owner approves and verifies hosted accounting and a real job.
    if: ${{ vars.ENABLE_NEBIUS_JOBS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SPECCHECK_URL: ${{ vars.SPECCHECK_URL }}
      SPECCHECK_ADMIN_TOKEN: ${{ secrets.SPECCHECK_ADMIN_TOKEN }}
    steps:
      - name: Request one idempotent controller launch and wait for its report
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import Request, HTTPRedirectHandler, build_opener

          base = os.environ['SPECCHECK_URL'].rstrip('/')
          token = os.environ['SPECCHECK_ADMIN_TOKEN']
          parsed = urlsplit(base)
          if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment or not token:
              raise SystemExit('Set the HTTPS controller URL and private SPECCHECK_ADMIN_TOKEN secret.')

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          client = build_opener(NoRedirect)

          def request(path, *, launch=False):
              headers = {'X-Admin-Token': token, 'Idempotency-Key': 'nightly-' + os.environ['GITHUB_RUN_ID']}
              try:
                  with client.open(Request(base + path, data=b'' if launch else None, headers=headers), timeout=45) as response:
                      return json.load(response)
              except (HTTPError, URLError, ValueError):
                  raise SystemExit('Controller request failed; inspect its job status before retrying. No direct cloud launch was attempted.') from None

          job = request('/api/watch/run', launch=True)
          for _ in range(240):
              current = next((row for row in request('/api/watch/jobs')['jobs'] if row['name'] == job['name']), None)
              if current and current['state'] == 'failed':
                  raise SystemExit('Cloud job failed; inspect controller diagnostics.')
              if current and current['state'] == 'done':
                  report = request('/api/watch')
                  if report.get('job_name') != job['name'] or report.get('mode') != 'live' or not report.get('items') or any(row.get('status') == 'unverified' for row in report['items']):
                      raise SystemExit('Completion has no matching valid live report.')
                  print('Controller reports completed job:', job['name'])
                  break
              time.sleep(15)
          else:
              raise SystemExit('No confirmed completion before timeout. Inspect the existing job; no duplicate was submitted.')
          PY

# The nightly re-check, as a Nebius Serverless Job.
#
# Every night this workflow asks Nebius AI Cloud to run scripts/recheck.py in the SpecCheck image: the approved
# submittals are checked again against the manufacturers' current documents (Nemotron 3 on Token Factory reads,
# Tavily fetches, code diffs), and the report is posted to the running demo so the Outcome step shows when the job
# last ran and what it found. Serverless Jobs run to completion and exit; they have no schedule of their own, so
# GitHub's cron is the clock and Nebius is the compute.
#
# Secrets (repository settings → Secrets and variables → Actions):
#   NEBIUS_SA_ID, NEBIUS_PUBLIC_KEY_ID, NEBIUS_PRIVATE_KEY  a Nebius service account with an authorized key
#   NEBIUS_PROJECT_ID                                        the Nebius project (parent) id
#   NEBIUS_API_KEY, TAVILY_API_KEY                           the same keys the app uses
#   SPECCHECK_ADMIN_TOKEN                                    ADMIN_TOKEN of the running demo
# Variables: SPECCHECK_URL (the demo's https URL), SPECCHECK_IMAGE (default ghcr.io/<owner>/speccheck:latest)
# See deploy/nebius/README.md.
name: nightly-recheck

on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC = 02:17 PT, after the manufacturers' sites have had their quiet hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ${{ vars.SPECCHECK_IMAGE || format('ghcr.io/{0}/speccheck:latest', github.repository_owner) }}
    steps:
      - name: Install the Nebius CLI
        run: |
          curl -sSL https://artifacts.nebius.cloud/cli/install.sh | bash
          echo "$HOME/.nebius/bin" >> "$GITHUB_PATH"

      - name: Sign in as the service account
        run: |
          umask 077
          printf '%s\n' "${{ secrets.NEBIUS_PRIVATE_KEY }}" > "$RUNNER_TEMP/sa.pem"
          nebius profile create \
            --endpoint api.nebius.cloud \
            --service-account-id "${{ secrets.NEBIUS_SA_ID }}" \
            --public-key-id "${{ secrets.NEBIUS_PUBLIC_KEY_ID }}" \
            --private-key-file "$RUNNER_TEMP/sa.pem" \
            --parent-id "${{ secrets.NEBIUS_PROJECT_ID }}" \
            --profile ci --no-browser

      - name: Create the Serverless Job
        id: job
        run: |
          NAME="speccheck-recheck-$(date -u +%Y%m%d-%H%M)"
          nebius ai job create \
            --profile ci \
            --name "$NAME" \
            --image "$IMAGE" \
            --container-command python \
            --args "scripts/recheck.py --post ${{ vars.SPECCHECK_URL }}" \
            --platform cpu-d3 \
            --preset 2vcpu-8gb \
            --disk-size 32Gi \
            --timeout 1h \
            --restart-policy never \
            --on-demand \
            --env SPECCHECK_MODE=live \
            --env THINKING=off \
            --env RECHECK_RUNNER="Nebius Serverless Job" \
            --env NEBIUS_API_KEY="${{ secrets.NEBIUS_API_KEY }}" \
            --env TAVILY_API_KEY="${{ secrets.TAVILY_API_KEY }}" \
            --env ADMIN_TOKEN="${{ secrets.SPECCHECK_ADMIN_TOKEN }}" \
            --async --no-progress
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Wait for it and print the log
        run: |
          JOB_ID=""
          for i in $(seq 1 30); do
            JOB_ID=$(nebius ai job get-by-name --profile ci --name "${{ steps.job.outputs.name }}" --format jsonpath='{.metadata.id}' 2>/dev/null || true)
            [ -n "$JOB_ID" ] && break
            sleep 10
          done
          echo "job id: $JOB_ID"
          for i in $(seq 1 60); do
            STATE=$(nebius ai job get --profile ci "$JOB_ID" --format jsonpath='{.status.state}' 2>/dev/null || echo unknown)
            echo "state: $STATE"
            case "$STATE" in *SUCCEEDED*|*COMPLETED*|*FAILED*|*ERROR*|*CANCEL*) break ;; esac
            sleep 15
          done
          nebius ai job logs --profile ci "$JOB_ID" || true
          case "$STATE" in *FAILED*|*ERROR*) exit 1 ;; esac

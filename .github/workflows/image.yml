# Build the one SpecCheck image (web app + API + scripts) and push it to GitHub Container Registry.
# The Nebius Serverless Endpoint (the demo) and the nightly Serverless Job (scripts/recheck.py) both pull it.
#
# The public manufacturer PDFs are not in git, so this build fetches them (scripts/fetch_docs.py); a host that
# refuses leaves that case on its recorded-text excerpt. To ship the PDFs, build locally after fetch_docs.py and
# push the image yourself: docker build -t ghcr.io/<you>/speccheck:latest . && docker push ghcr.io/<you>/speccheck:latest
name: image

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "FEEDBACK.md", "deploy/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Reuse the locked public PDFs: the manufacturer rejects c02 downloads from GitHub runners.
      - name: Restore verified public PDFs from the frozen release
        run: |
          docs_container=$(docker create ghcr.io/wongywrongy/speccheck@sha256:d5b22ed554d26dac83808ea53155d8a28d03bd3f2c6623171cb6b5321093bb07)
          trap 'docker rm "$docs_container" >/dev/null' EXIT
          mkdir -p data/raw
          docker cp "$docs_container:/app/data/raw/." data/raw/
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/speccheck:latest
            ghcr.io/${{ github.repository_owner }}/speccheck:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
